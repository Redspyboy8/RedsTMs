#modId = "cobblemon"
#type = "required"
#versionRange = "${cobblemon_version_range}"
#ordering = "NONE"
#side = "BOTH"


[[mixins]]
config = "${mod_id}-common.mixins.json"
[[mixins]]
config = "${mod_id}.mixins.json"
